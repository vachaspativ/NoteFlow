ui_mode: node
theme: light
web_host: 127.0.0.1
web_port: 5000
transcription_mode: live
whisper_model: small.en
whisper_device: auto
whisper_download_root: models
allow_online_model_download: false
chunk_duration_secs: 3
vad_threshold: 0.5
enable_loopback: true
auto_call_detection: true
default_meeting_title_prefix: '[NoteFlow] Meeting'
notes_dir: ../noteflow_notes
sessions_dir: ../noteflow_sessions
ollama_host: http://localhost
ollama_port: 11434
ollama_model: llama3.2
ollama_timeout: 300
ollama_max_retries: 1
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_use_tls: true
enable_email: false
smtp_username: you@gmail.com
smtp_password: xxxx_app_password_xxxx
email_from: you@gmail.com
email_to: recipient@example.com
email_subject_prefix: '[NoteFlow]'
enable_map_reduce: false
# --- Auto call detection tuning ---
# Enable network-based detection (UDP connections to Teams/Meet media relay IPs)
daemon_network_check_enabled: true
# Enable Teams log file watcher (Windows only, new & classic Teams)
daemon_log_watch_enabled: true
# Enable process-scoped window title check (fallback)
daemon_window_check_enabled: true
# Number of consecutive polls needed to confirm call start (default: 2 = ~6 seconds)
daemon_active_streak_required: 2
# Minimum simultaneous qualifying UDP connections to declare call active
daemon_min_udp_connections: 2
